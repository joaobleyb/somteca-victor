{# Mensagens do django.contrib.messages (ex.: "Música cadastrada com sucesso!") #}
{% if messages %}
<div class="mb-3">
    {% for mensagem in messages %}
    <div class="alert alert-{{ mensagem.tags }} alert-dismissible fade show" role="alert">
        {{ mensagem }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    {% endfor %}
</div>
{% endif %}
